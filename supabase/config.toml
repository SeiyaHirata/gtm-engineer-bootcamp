# Supabase CLI configuration
# https://supabase.com/docs/guides/cli/config
#
# ReServe合宿（仮想予約SaaS）用のローカルSupabaseエミュレーター設定。
# `supabase start` で起動 → migrations 適用 → seed 投入 の標準フロー。

# プロジェクト識別子。`supabase` ディレクトリ単位で一意。
project_id = "gtm-engineer-bootcamp"

[api]
enabled = true
# REST/GraphQL API のポート。受講生は基本ここではなく Studio / psql を使う。
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
# Postgres 接続ポート（psql・GUIクライアントの接続先）。
port = 54322
# マイグレーション差分用のシャドウDBポート。
shadow_port = 54320
# Postgres メジャーバージョン。
major_version = 15

[db.seed]
# seed.sql を `supabase start` / `supabase db reset` 時に投入する。
# 既定でも supabase/seed.sql は読まれるが、明示しておく（migrations 適用後に実行される）。
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
# Studio（GUI）のポート。SQLエディタでファネルSQLを叩く想定。
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
# ローカルのメール受信ボックス（本合宿では未使用だが標準構成として有効化）。
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
# 認証は本合宿のワークでは使わないが、標準構成として有効化しておく。
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
